[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oevl"
version = "0.1.0"
description = "Old English vowel-length restoration (UZH, Essentials in Text and Speech Processing, HS26)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
