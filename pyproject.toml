[build-system]
requires = ["setuptools>=77"]  # PEP 639 license fields
build-backend = "setuptools.build_meta"

[project]
name = "oevl"
version = "0.1.0"
description = "Old English vowel-length restoration (UZH, Essentials in Text and Speech Processing, HS26)"
requires-python = ">=3.11,<3.15"  # the pinned numpy/scipy/scikit-learn have no 3.15 wheels
license = "MIT"  # the code; the data licences are in data/LICENSE.md
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]
